title = "ROMA gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "obvious demo/test fixtures and placeholders (not real secrets)"
regexTarget = "match"
regexes = [
  '''roma-demo-key-[0-9]+''',
  '''roma-admin-key''',
  '''admin-key-beta-2026''',
  '''admin-super-key-xyz''',
  '''YOUR_API_KEY''',
  '''<your_api_key>''',
  '''<ключ>''',
  '''test-key-[a-zA-Z0-9-]+''',
  '''wrong-key''',
  '''sk_test_placeholder''',
  '''whsec_placeholder''',
  # `.env.example` ships the pair `VASTAI_API_KEY=` + `VASTAI_DEFAULT_GPU=<model>`.
  # generic-api-key matches across the newline, so the allowlist must cover the
  # same span (the old pattern required a `VASTAI_API_KEY=` prefix and never fired).
  '''API_KEY=\s*\n?VASTAI_DEFAULT_GPU=''',
  # Placeholder Stripe keys in `deploy/vault/scripts/vault-init.sh` (literal X's).
  '''sk_live_X+''',
  '''sk_test_X+''',
]
