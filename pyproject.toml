[project]
name = "roma-execution-bridge"
version = "1.0.0"
description = "ROMA JSON → Kubernetes Job Compiler"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.30.0,<0.32",
    "pydantic>=2.0,<3.0",
    "prometheus-fastapi-instrumentator>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "kubernetes>=29.0,<32.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "openai>=1.0,<2.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9,<3.0",
    "asyncpg>=0.29,<1.0",
    "requests>=2.32.4,<3.0",
    "PyJWT>=2.13.0,<3.0",
    "redis>=5.0,<6.0",
    "psutil>=5.9,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "starlette>=1.3.1,<2.0",
    "slowapi>=0.1.9,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0,<27.0",
    "opentelemetry-api>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
roma-bridge = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "audit",
    "auth",
    "billing",
    "compiler",
    "consistency",
    "control_plane",
    "cost",
    "dashboard",
    "durability",
    "ecosystem",
    "gpu_worker",
    "ha",
    "input_contract",
    "k8s",
    "models",
    "observability",
    "operator_sdk",
    "org",
    "queue_manager",
    "rbac",
    "reconciler",
    "roma",
    "roma_planner",
    "saas",
    "saas_api",
    "scheduler",
    "tenancy",
    "validator",
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "ops: операционные/инвариантные проверки (бюджет рестартов, изоляция, дрейф артефактов)",
    "gpu: проверки, требующие живого GPU-воркера (без ROMA_GPU_LIVE=1 скипаются)",
]

# E-01: любое исключение из pytest (--ignore / collect_ignore) обязано иметь тройку
# (таблица стоит вне [tool.pytest], иначе pytest видит конфликт native TOML и ini_options)
# reason · issue · expiry. Проверяется tests/test_exclusion_policy.py: без тройки
# или с истёкшей датой suite краснеет. Иначе исключение = слепой ignore.
[tool.pytest_exclusions]
# Активных исключений НЕТ (2026-09-21): все три исторических --ignore сняты.
#   test_ci.py                  → scripts/ci_smoke.py (вне коллекции: это раннер, вызывается CI-шагом)
#   saas/.../test_rate_limiter.py → 7/7 проходят, un-ignore
#   saas/.../test_gateway.py      → 9 проходят, 1 fail-open помечен xfail(strict=False) с issue R-5-gateway-auth
# Запись ниже — история решённого исключения, чтобы повторный "--ignore" не появился «на память».
# "example/legacy_test.py" = { reason = "...", issue = "P1-XXX", expiry = "2026-11-01" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
