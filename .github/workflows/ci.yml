name: ROMA CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install deps
        # G-CI-DEPS-INCOMPLETE: список зависимостей живёт в репозитории
        # (requirements-ci.txt), а не в этом файле — иначе он разъезжается с деревом.
        run: pip install -r requirements-ci.txt
      - name: Compile check
        run: |
          find . -name "*.py" -not -path "./__pycache__/*" -exec python -m py_compile {} + 2>&1 | tail -5
          echo "Compile OK"
      - name: Import smoke (repo-wide, без env/GPU)
        run: |
          python -c "import gpu_worker.connector; print('import-smoke OK: gpu_worker.connector')"
          python -c "import scheduler.roma_scheduler; print('import-smoke OK: scheduler.roma_scheduler')"
      - name: Run tests
        run: python3 scripts/ci_smoke.py
  pytest-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # G-CI-PG-CANON: реальный PostgreSQL вместо скипов. Без него PG-зависимые
    # проверки (ledger-триггеры, money-path, миграции) уходили в env-skip, и
    # «зелёный» CI не подтверждал ни покрытие money-path, ни схему.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roma
          # CI-эфемерал, localhost: значение живёт только внутри job'а
          POSTGRES_PASSWORD: ci-ephemeral-localhost
          POSTGRES_DB: roma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roma -d roma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI-эфемерал, localhost: тестовая БД roma_test (изоляция A1: точное имя)
      PG_DSN: "postgresql://roma:ci-ephemeral-localhost@localhost:5432/roma_test"
      # CI-эфемерал, не секрет: базис измерения тот же, что в каноне ноды — ветка
      # GPU-бэкенда исполняется (без VAST_KEY она честно уходит в local с
      # предупреждением). Без этой переменной знаменатель покрытия иной, и
      # сравнение CI с каноном было бы сравнением разных областей измерения.
      ROMA_EXECUTION_BACKEND: vastai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install deps
        # G-CI-DEPS-INCOMPLETE: тот же список, что в test-джобе (единый источник).
        run: pip install -r requirements-ci.txt
      - name: Apply migrations to CI test DB (реальный вход миграций, без глушителей)
        run: python scripts/run_migrations.py
      - name: "Full suite — repo-wide (A-2/N7b: область прогона = весь репозиторий)"
        run: |
          python -m pytest -q -rs --junitxml=junit.xml
          python scripts/ci_junit_smoke.py junit.xml
      - name: Single-file parity gate (P1-C)
        run: bash ci/parity_check.sh
      - name: Coverage ratchet gate (P1-D)
        run: bash ci/coverage_gate.sh
      - name: Jev checks (outside canon)
        run: >-
          python -m pytest -q -p no:cacheprovider
          adapters/jev/checks/jev_checks.py
          plugins/builtin/jev_policy_checks.py
          plugins/builtin/jev_triage_checks.py
          core/jev_observer_checks.py
          core/jev_shadow_log_checks.py
          cost/jev_shadow_checks.py
          core/jev_cascade_checks.py
        env:
          JEV_ENABLED: "0"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install ruff
        # G-TOOL-PIN: точный пин версии. Без него CI получал свежий ruff
        # (0.16.8: 1286 замечаний на неизменном дереве, run 35697239211) —
        # «зелёный lint» зависел от даты запуска, а не от содержимого коммита.
        # Версия ниже — та, на которой дерево зелёное на ноде (ruff 0.15.20).
        run: pip install ruff==0.15.20
      - name: Lint
        run: ruff check . --output-format=concise
      - name: Format check
        # N-RUFF-FORMAT: без этого шага дрейф форматирования невидим — `ruff check`
        # не смотрит на переносы строк, поэтому дерево может разъехаться с
        # конвенцией и оставаться «зелёным». Версия ruff та же, что у Lint выше:
        # форматтер между версиями меняет вывод, и рассинхрон даёт ложный красный.
        run: ruff format --check .

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version v3.14.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          ls /usr/local/bin/helm
      - name: Helm lint
        run: |
          helm lint charts/roma-execution-bridge --quiet || exit 1
          echo "Helm lint passed"
      - name: Helm template (dry-run)
        run: |
          helm template roma-test charts/roma-execution-bridge \
            --set apiServer.replicaCount=2 \
            --set gpuWorker.replicaCount=1 \
            --set apiServer.autoscaling.enabled=true \
            --set gpuWorker.autoscaling.enabled=true \
            > /tmp/roma-template.yaml
          echo "Helm template OK"
      - name: Validate HPA manifests rendered
        run: |
          grep -c "kind: HorizontalPodAutoscaler" /tmp/roma-template.yaml
          echo "HPA count OK"
      - name: Validate PDB manifests rendered
        run: |
          grep -c "kind: PodDisruptionBudget" /tmp/roma-template.yaml
          echo "PDB count OK"

  # G-IAC-SCAN: helm-validate проверяет рендер и lint чарта, но не безопасность
  # манифестов (root/privileged/hostPath/plaintext-secret). Checkov — второй,
  # независимый слой по IaC: deploy/ (kustomize, raw manifests, overlays, CRD,
  # мониторинг) и charts/. Манифесты не меняются: ворота показывают текущий долг,
  # а не переписывают его молча.
  iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # G-TOOL-PIN-PENDING: диапазон вместо точного пина, потому что точная
      # версия не подтверждена офлайн; после первого зелёного прогона на master
      # диапазон заменяется точным пином (тот же приём, что с ruff 0.15.20).
      - name: Install Checkov
        run: pip install "checkov~=3.2.0"
      # Секреты намеренно не включены в --framework: их владелец — gitleaks
      # (secret-scan/security.yml). Дублировать владение одним классом находок
      # двумя джобами — это не усиление, а размывание ответственности.
      - name: Checkov — deploy/ (fail on HIGH/CRITICAL)
        run: >
          checkov -d deploy/ --framework kubernetes,helm
          --hard-fail-on HIGH,CRITICAL --compact --quiet
      - name: Checkov — charts/ (fail on HIGH/CRITICAL)
        run: >
          checkov -d charts/ --framework kubernetes,helm
          --hard-fail-on HIGH,CRITICAL --compact --quiet

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: docker://zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: detect --source=/github/workspace --redact --config=/github/workspace/.gitleaks.toml --exit-code=1

  # G-CI-SOFTENED (2026-09-22): обе security-джобы были смягчены ДВАЖДЫ —
  # `continue-on-error: true` (джоба не может покраснеть) и `|| echo "... non-blocking"`
  # (команда не может вернуть ненулевой код). Из-за этого pip-audit-шаг с
  # неразрешимым входом (ResolutionImpossible в requirements-worker.txt) выглядел
  # зелёным. Смягчение снято: ворота твёрдые. Профиль bandit — тот же, что в
  # security.yml (единственный владелец профиля severity): money path medium+,
  # repo-wide high. Находки Low/Medium вне money path ворот не открывали никогда;
  # это зарегистрированный долг, а не молчаливый пропуск.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: pip-audit (enforced — любая известная уязвимость валит джобу)
        run: |
          pip install "pip-audit==2.7.3"
          pip-audit -r requirements-worker.txt --progress-spinner off

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: bandit — money path (medium+)
        run: |
          pip install "bandit==1.8.0"
          bandit -r billing/ routers/ auth/ monitoring/ security/ main.py db_adapter.py -ll -q
      - name: bandit — repo-wide (high only)
        run: bandit -r . -x ./.venv,./node_modules,./tests,./.git -lll -q

  promtool-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect monitoring changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            monitoring:
              - 'deploy/monitoring/**'
      - name: Download Prometheus v2.54.1 (sha256-pinned)
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz
          echo "31715ef65e8a898d0f97c8c08c03b6b9afe485ac84e1698bcfec90fc6e62924f  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --strip-components=1
          sudo install -m 0755 /tmp/promtool /usr/local/bin/promtool
      - name: promtool check rules
        if: steps.filter.outputs.monitoring == 'true'
        run: promtool check rules deploy/monitoring/alert-rules-roma.yml
      - name: promtool test rules
        if: steps.filter.outputs.monitoring == 'true'
        run: |
          cd deploy/monitoring/tests
          promtool test rules *.test.yml
