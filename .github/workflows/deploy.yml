name: ROMA Deploy to Zo

on:
  workflow_run:
    workflows: ["ROMA CI"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: SSH key diagnostics (class only, no key material)
        env:
          ZO_SSH_KEY: ${{ secrets.ZO_SSH_KEY }}
        run: |
          echo "ssh: $(ssh -V 2>&1 | head -1)"
          if [ -z "$ZO_SSH_KEY" ]; then
            echo "key: ABSENT"
            exit 1
          fi
          case "$ZO_SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) echo "key: OpenSSH" ;;
            *"BEGIN RSA PRIVATE KEY"*) echo "key: PEM-RSA (legacy; convert to OpenSSH)" ;;
            *"PuTTY-User-Key-File"*) echo "key: PuTTY-ppk (unsupported; convert to OpenSSH)" ;;
            *) echo "key: unknown-format" ;;
          esac

      - name: Setup SSH key (fail-fast, format-checked)
        env:
          ZO_SSH_KEY: ${{ secrets.ZO_SSH_KEY }}
        run: |
          if [ -z "$ZO_SSH_KEY" ]; then
            echo "::error::ZO_SSH_KEY is empty/absent — set the deploy key (docs/upgrade-notes.md)"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$ZO_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>"$RUNNER_TEMP/key_err"; then
            echo "::error::SSH key not loadable ('error in libcrypto') — format/encoding issue; regenerate per docs/upgrade-notes.md (CRLF stripped automatically; check .ppk/PEM/whitespace)"
            exit 1
          fi
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"
          ssh-add "$KEY_FILE" >/dev/null 2>&1 || { echo "::error::ssh-add failed"; exit 1; }

      - name: Deploy to Zo
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.ZO_USER }}@${{ secrets.ZO_HOST }} << 'EOF'
            cd /home/workspace/roma-execution-bridge
            git pull origin master
            source venv/bin/activate 2>/dev/null || true
            pip install -e ".[dev]" -q
            supervisorctl restart roma-execution-bridge
            echo "Deploy complete"
          EOF

      - name: Health check
        run: |
          sleep 5
          curl -sf https://roma-execution-bridge-asurdev.zocomputer.io/health || echo "Health check failed"
