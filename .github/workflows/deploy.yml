name: ROMA Deploy to Zo

on:
  workflow_run:
    workflows: ["ROMA CI"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ZO_SSH_KEY }}

      - name: Deploy to Zo
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.ZO_USER }}@${{ secrets.ZO_HOST }} << 'EOF'
            cd /home/workspace/roma-execution-bridge
            git pull origin master
            source venv/bin/activate 2>/dev/null || true
            pip install -e ".[dev]" -q
            supervisorctl restart roma-execution-bridge
            echo "Deploy complete"
          EOF

      - name: Health check
        run: |
          sleep 5
          curl -sf https://roma-execution-bridge-asurdev.zocomputer.io/health || echo "Health check failed"
