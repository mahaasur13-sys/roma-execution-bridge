# Optional Playwright smoke. Не входит в ci.yml / pytest-suite / канон полноты.
name: e2e (Playwright, optional)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/**"
      - "static/**"
      - "routers/auth.py"
      - "main.py"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.6"
      - name: Install runtime + e2e dependencies
        run: |
          # requirements-ci.txt is pre-generated and committed; install strictly with hashes
          pip install --require-hashes -r requirements-ci.txt
          uv export --locked --only-group e2e --no-emit-project -o requirements-e2e.txt
          pip install --require-hashes -r requirements-e2e.txt
      - name: Install Playwright browser
        run: |
          pip show playwright | grep "^Version: ${PLAYWRIGHT_VERSION}$" > /dev/null \
            || (echo "playwright version mismatch"; pip show playwright; exit 1)
          python -m playwright install --with-deps chromium
      - name: Playwright e2e (read-only smoke)
        env:
          VASTAI_ENABLED: "false"
          ROMA_EXECUTION_MODE: local
          PG_DSN: ""
          VAST_KEY: ""
          VASTAI_API_KEY: ""
        # -o addopts= снимает --ignore=e2e из pyproject, иначе каталог не соберётся.
        run: python -m pytest e2e/ -m e2e --browser=chromium -q --tb=short -o addopts=
