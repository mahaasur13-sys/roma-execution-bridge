name: Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # G-TOOL-PIN: тот же пин, что в ROMA CI (детерминизм инструмента).
      - run: pip install "bandit==1.8.0"

      # Money path (billing/authrouters/monitoring): fail on medium+high.
      # Known-safe dynamic SQL in db_adapter.py carries inline `# nosec B608`
      # markers with justification, so any NEW string-built SQL fails here.
      - name: bandit — money path (medium+)
        run: >
          bandit -r billing/ routers/ auth/ monitoring/ security/ main.py db_adapter.py
          -ll -q

      # Repo-wide: high severity only. This is the net that catches what a
      # narrow scope used to hide (jinja2 autoescape, paramiko AutoAddPolicy).
      - name: bandit — repo-wide (high only)
        run: >
          bandit -r . -x ./.venv,./node_modules,./tests,./.git
          -lll -q

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # G-TOOL-PIN: точный пин инструмента (аудит воспроизводится, а не зависит от даты прогона).
      - run: pip install "pip-audit==2.7.3"

      # S1/G-SEC-SCAN: аудируем окружение, но сначала обновляем его инструментальную часть.
      # Раннер приносит setuptools 79.0.1 (PYSEC-2026-3447, правится в 83.0.0) и старый pip
      # (PYSEC-2026-196/1795/1796/2875/2876/3721, PYSEC-2023-228): обновление версий —
      # реальное устранение, а не подавление находки.
      - name: Install audited dependencies (+ non-vulnerable tooling)
        run: |
          pip install -U "pip>=26.1.2" "setuptools>=83"
          pip install -e .

      # Первопартийный дистрибутив (сам roma-execution-bridge) отсутствует на PyPI и не может
      # быть аудирован: исключается ТОЛЬКО он документированным механизмом --skip-editable
      # (editable-установка строкой выше). Все сторонние зависимости аудируются целиком.
      - name: pip-audit (enforced — any known vulnerability fails the job)
        run: pip-audit --progress-spinner off --skip-editable

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "gitleaks (config: .gitleaks.toml)"
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --config .gitleaks.toml --redact --exit-code 1
