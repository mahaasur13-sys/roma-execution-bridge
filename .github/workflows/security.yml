name: Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # G-TOOL-PIN: тот же пин, что в ROMA CI (детерминизм инструмента).
      - run: pip install "bandit==1.8.0"

      # Money path (billing/authrouters/monitoring): fail on medium+high.
      # Known-safe dynamic SQL in db_adapter.py carries inline `# nosec B608`
      # markers with justification, so any NEW string-built SQL fails here.
      - name: bandit — money path (medium+)
        run: >
          bandit -r billing/ routers/ auth/ monitoring/ security/ main.py db_adapter.py
          -ll -q

      # Repo-wide: high severity only. This is the net that catches what a
      # narrow scope used to hide (jinja2 autoescape, paramiko AutoAddPolicy).
      - name: bandit — repo-wide (high only)
        run: >
          bandit -r . -x ./.venv,./node_modules,./tests,./.git
          -lll -q

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # G-TOOL-PIN: точный пин инструмента (аудит воспроизводится, а не зависит от даты прогона).
      - run: pip install "pip-audit==2.7.3"

      # S1/G-SEC-SCAN: аудируем окружение, но сначала обновляем его инструментальную часть.
      # Раннер приносит setuptools 79.0.1 (PYSEC-2026-3447, правится в 83.0.0) и старый pip
      # (PYSEC-2026-196/1795/1796/2875/2876/3721, PYSEC-2023-228): обновление версий —
      # реальное устранение, а не подавление находки.
      - name: Install audited dependencies (+ non-vulnerable tooling)
        run: |
          pip install -U "pip>=26.1.2" "setuptools>=83"
          pip install -e .

      # Первопартийный дистрибутив (сам roma-execution-bridge) отсутствует на PyPI и не может
      # быть аудирован: исключается ТОЛЬКО он документированным механизмом --skip-editable
      # (editable-установка строкой выше). Все сторонние зависимости аудируются целиком.
      - name: pip-audit (enforced — any known vulnerability fails the job)
        run: pip-audit --progress-spinner off --skip-editable

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: "gitleaks (config: .gitleaks.toml)"
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --config .gitleaks.toml --redact --exit-code 1

  # DEVSECOPS-PHASE1 (Semgrep): дополнительный SAST-слой (taint/dataflow).
  # bandit выше остаётся владельцем профиля money-path (medium+) и ничем не
  # заменяется — это отдельная джоба, а не замена. Ворота: --error (падение
  # только на находках уровня ERROR).
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — baseline-коммит обязан присутствовать в локальной
      # истории, иначе semgrep не сможет отдиффовать рабочее дерево.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install semgrep
        # G-TOOL-PIN-PENDING: диапазон вместо точного пина — точная версия
        # ставится после первого зелёного прогона на master.
        run: pip install "semgrep>=1.95,<2"
      # --metrics=off: без телеметрии (никакой отправки метрик на semgrep.dev).
      # Набор p/ci тянется из реестра semgrep — это единственное сетевое чтение
      # правил, сами правила в репозитории не дублируются.
      #
      # --baseline-commit: ворота оценивают ТОЛЬКО дельту этого изменения, а не
      # весь накопленный baseline репозитория. Существующие находки не исчезают
      # из отчёта — они перестают блокировать этот PR; отдельный слой
      # (bandit medium+ / repo-wide) продолжает работать по всему дереву.
      - name: semgrep — p/ci (fail on ERROR, delta-only)
        env:
          # PR: база PR. push: предыдущий head. Оба доступны при fetch-depth: 0.
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASELINE_SHA" ] || ! git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null; then
            echo "baseline commit недоступен (пустой SHA или новый ref) — полный скан"
            semgrep scan --config=p/ci --error --metrics=off
          else
            echo "baseline commit: $BASELINE_SHA"
            semgrep scan --config=p/ci --error --metrics=off \
              --baseline-commit="$BASELINE_SHA"
          fi

  # DEVSECOPS-PHASE1 (Trivy): контейнерное сканирование как отдельный эшелон.
  # До этого слоя не было: образы собирались и подписывались, но содержимое
  # (OS-пакеты и библиотеки) не проверялось. Ворота твёрдые — CRITICAL валит job.
  #
  # G-TRIVY-PR-GATE: слой живёт здесь, а не в cosign.yml, потому что ворота
  # обязаны видеть pull_request, а cosign.yml на PR запускать нельзя: его job
  # `signing` пушит в GHCR теги `:latest` и `build-<sha>` и подписывает их —
  # образ из ветки опубликовался бы как `:latest`, а на форк-PR GITHUB_TOKEN
  # read-only и push упал бы (джоба красная не из-за находки, а из-за прав).
  # Здесь образ собирается локально в раннере и сканируется из локального
  # стора Docker: ни реестра, ни пуша, ни секретов — поэтому слой работает и
  # на форк-PR. Dockerfile'ы и контексты сборки — те же три, что собирает
  # cosign.yml; сами Dockerfile'ы не меняются.
  trivy:
    runs-on: ubuntu-latest
    # Три docker build + скан: 15 минут (бюджет сканирующей джобы в cosign.yml)
    # мало для образа gpu-worker, поэтому бюджет поднят здесь, а не срезан
    # через исключение образов.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # G-TOOL-PIN: версия инструмента фиксирована (аудит воспроизводится,
      # а не зависит от даты прогона) — тот же принцип, что у ruff/bandit.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.58.1

      # Локальные теги, а не реестровые: сборка идёт из рабочего дерева этого
      # PR (или этого push), то есть сканируется именно то, что предлагается
      # смёржить, а не последний опубликованный образ.
      - name: Build the three images locally (no push)
        run: |
          docker build -t roma-scan-gpu-worker -f Dockerfile.gpu-worker .
          docker build -t roma-scan-stripe-webhook -f deploy/stripe-webhook/Dockerfile deploy/stripe-webhook/
          docker build -t roma-scan-operator -f config/crd/Dockerfile.operator .

      - name: Trivy image scan — CRITICAL (fails the job)
        run: |
          for IMG in roma-scan-gpu-worker roma-scan-stripe-webhook roma-scan-operator; do
            echo "=== Trivy $IMG ==="
            trivy image --exit-code 1 --severity CRITICAL --no-progress "$IMG"
          done
