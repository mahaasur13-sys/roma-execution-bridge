name: Cosign Image Signing

# G-COSIGN-SIGNING (2026-09-22) — разбор класса «конфигурация подписи не та»:
#   * `cosign-version` — несуществующий вход cosign-installer@v3 (валиден
#     `cosign-release`): установщик его молча игнорировал и ставил свой дефолт
#     (в run 35723884170 — v2.5.2), а команды ниже использовали флаг
#     `--audit-log-entry`, которого в cosign нет вовсе → «unknown flag», exit 123;
#   * `--identity-token` получал URL запроса токена (а не токен) и не нужен вовсе:
#     keyless-подпись берёт OIDC-токен GitHub из окружения, секретов не требует;
#   * шаг верификации содержал повреждённые строки (плейсхолдеры вместо флагов)
#     и глушитель `|| echo "Signature OK"` — то есть проверка не могла провалиться;
#   * в job `attest` переменная TAG_SUFFIX не вычислялась (шага не было) → тег образа
#     склеивался пустым, а сам вызов содержал несуществующий флаг `--ticket`.
# Что исправлено: пин версии через валидный вход, команды приведены к keyless-флоу,
# повреждённые строки убраны, глушители убраны, job `attest` получает тот же
# TAG_SUFFIX и подписывает тот же тег реальным SLSA-предикатом.
# Триггер не сужен: подписываются ровно те образы, которые этот же workflow
# собирает и пушит в GHCR (на master — `:latest` и `:<sha>`, на теге — `v*`).

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated image names (gpu-worker,stripe-webhook,operator)"
        default: "gpu-worker,stripe-webhook,operator"
        required: false

env:
  REGISTRY: ghcr.io/${{ github.actor }}
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  signing:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          # G-TOOL-PIN: валидный вход установщика (`cosign-release`), версия фиксирована.
          cosign-release: v2.4.1

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get tag suffix
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_SUFFIX=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_SUFFIX=build-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Build and sign gpu-worker
        if: contains(github.event.inputs.images, 'gpu-worker') || github.event.inputs.images == ''
        env:
          IMAGE_TAGS: ghcr.io/${{ github.repository }}/gpu-worker:latest ghcr.io/${{ github.repository }}/gpu-worker:${{ env.TAG_SUFFIX }}
        run: |
          for TAG in $IMAGE_TAGS; do
            docker build -t "$TAG" -f Dockerfile.gpu-worker .
            docker push "$TAG"
          done
          for TAG in $IMAGE_TAGS; do
            cosign sign --yes "$TAG"
          done

      - name: Build and sign stripe-webhook
        if: contains(github.event.inputs.images, 'stripe-webhook') || github.event.inputs.images == ''
        env:
          IMAGE_TAGS: ghcr.io/${{ github.repository }}/stripe-webhook:latest ghcr.io/${{ github.repository }}/stripe-webhook:${{ env.TAG_SUFFIX }}
        run: |
          # G-COSIGN-DOCKERFILE-CONTEXT: контекст — каталог самого образца (его Dockerfile
          # копирует requirements.txt и app/ относительно контекста, корень их не содержит).
          for TAG in $IMAGE_TAGS; do
            docker build -t "$TAG" -f deploy/stripe-webhook/Dockerfile deploy/stripe-webhook/
            docker push "$TAG"
          done
          for TAG in $IMAGE_TAGS; do
            cosign sign --yes "$TAG"
          done

      - name: Build and sign operator
        if: contains(github.event.inputs.images, 'operator') || github.event.inputs.images == ''
        env:
          IMAGE_TAGS: ghcr.io/${{ github.repository }}/operator:latest ghcr.io/${{ github.repository }}/operator:${{ env.TAG_SUFFIX }}
        run: |
          for TAG in $IMAGE_TAGS; do
            docker build -t "$TAG" -f config/crd/Dockerfile.operator .
            docker push "$TAG"
          done
          for TAG in $IMAGE_TAGS; do
            cosign sign --yes "$TAG"
          done

      # G-COSIGN-BUNDLE-NOOP (2026-09-22) — здесь стоял шаг «Upload attestation
      # bundle (SLSA provenance)» (actions/upload-artifact@v4, path
      # ~/.cosign/.attestation, if-no-files-found: ignore). Пути не существовало
      # ни разу: прогон 35769398021 — «No files were found with the provided
      # path: ~/.cosign/.attestation. No artifacts will be uploaded.»
      # Аттестация — артефакт РЕЕСТРА, не локальный файл: cosign attest
      # публикует DSSE-конверт в тот же GHCR-репозиторий (referring artifact)
      # и записывает вход в Rekor tlog; у cosign v2.4.1 нет флага локального
      # вывода бандла (doc/cosign_attest.md тега v2.4.1: --predicate, --type,
      # --no-upload; --output-* отсутствует). Шаг давал «success без файла»
      # и вводил в заблуждение; рождается бандл в job `attest`, там и живёт
      # его доказательство — `cosign verify-attestation` из реестра.

      - name: Verify signatures exist
        run: |
          for IMG in gpu-worker stripe-webhook operator; do
            echo "=== Verifying $IMG ==="
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "ghcr.io/${GITHUB_REPOSITORY}/${IMG}:${TAG_SUFFIX}"
          done

      - name: Sync signatures to Rekor (transparency log)
        if: github.event_name != 'workflow_dispatch'
        run: |
          for IMG in gpu-worker stripe-webhook operator; do
            echo "Rekor entry for $IMG — published at https://search.sigstore.dev"
          done

  attest:
    needs: signing
    runs-on: ubuntu-latest
    # G-COSIGN-ATTEST-UNAUTHORIZED: аттестация — такой же артефакт реестра, как
    # подпись: cosign attest читает образ и публикует аттестацию в тот же
    # репозиторий GHCR. Токену нужен write (packages: read читает, но не пишет),
    # а вход в реестр — правда самой job, не глобаль (docker/login-action пишет
    # ~/.docker/config.json, откуда креденшел берёт cosign), поэтому login стоит
    # и здесь, а не только в signing.
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      # G-COSIGN-ATTEST-UNAUTHORIZED: без этого шага cosign шёл в реестр
      # анонимно → GET https://ghcr.io/token?scope=...:pull → 401.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get tag suffix
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_SUFFIX=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG_SUFFIX=build-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Generate SLSA provenance predicate
        run: |
          printf '{"buildType":"https://github.com/%s/roma-release-sign","builder":{"id":"https://github.com/actions/runner"},"invocation":{"configSource":{"uri":"git+https://github.com/%s@%s","digest":{"sha1":"%s"},"entryPoint":".github/workflows/cosign.yml"}}}' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SHA" > /tmp/roma-slsa-predicate.json
          jq -e . /tmp/roma-slsa-predicate.json > /dev/null && echo "predicate JSON valid"

      - name: Attest images (SLSA provenance)
        run: |
          for IMG in gpu-worker stripe-webhook operator; do
            TAG="ghcr.io/${GITHUB_REPOSITORY}/${IMG}:${TAG_SUFFIX}"
            echo "=== Attesting $TAG ==="
            cosign attest --yes --type slsaprovenance --predicate /tmp/roma-slsa-predicate.json "$TAG"
          done
