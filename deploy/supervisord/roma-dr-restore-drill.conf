; Weekly pg_dump restore drill — sample program, NOT auto-loaded.
;
; Install on the host by copying the [program:...] block into
; /etc/zo/supervisord-user.conf, then:
;   supervisorctl -c /etc/zo/supervisord-user.conf update
;   supervisorctl -c /etc/zo/supervisord-user.conf status roma-dr-restore-drill
;
; Same mechanism as astrofin-pgdump / astrofin-xau-refresher: supervisord keeps a
; long-lived loop alive, the script itself sleeps until Sunday 04:30Z (one hour
; after the 03:30Z dump). No cron on this host.
;
; Secrets: none here. scripts/pg_restore_drill.sh reads its own 600 root env file
; (B2_CREDS, default /root/.sealed/b2-pgdump.env) — never argv, never logs.
;
; Runbook: docs/RESTORE-DRILL-RUNBOOK.md

[program:roma-dr-restore-drill]
command=bash /home/workspace/roma-execution-bridge/scripts/pg_restore_drill_weekly.sh
directory=/home/workspace/roma-execution-bridge
environment=
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
startretries=20
startsecs=5
stdout_logfile=/dev/shm/roma-dr-restore-drill.log
stderr_logfile=/dev/shm/roma-dr-restore-drill_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
