# ROMA Execution Bridge v1.2.0 — Alert Rules
# Provider: Grafana Unified Alerting (Prometheus datasource)
# Contact point: telegram-alerts (Telegram Bot @IDIA_TELEPORT_Bot, chat 1022845958)

groups:
  - name: roma-critical
    rules:
      - alert: ROMAHighErrorRate
        expr: |
          sum(rate(roma_requests_total{status=~"5.."}[5m]))
          / sum(rate(roma_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: critical, category: api}
        annotations:
          summary: "ROMA error rate above 5% ({{ $value | humanizePercentage }})"
          description: "5xx errors spiking. Check /metrics and Loki logs for /dev/shm/roma-execution-bridge.log"

      - alert: ROMABillingWebhookDown
        expr: |
          (sum(increase(roma_cloudpayments_failure_total[10m])) > 0)
          or (absent(roma_cloudpayments_webhooks_total))
        for: 3m
        labels: {severity: critical, category: billing}
        annotations:
          summary: "CloudPayments webhook failures detected"
          description: "investigate immediately — tenants cannot complete payments"

      - alert: ROMANoMetrics
        expr: roma_requests_total or absent(roma_requests_total)
        for: 2m
        labels: {severity: critical, category: monitoring}
        annotations:
          summary: "ROMA /metrics endpoint not responding"

  - name: roma-warning
    rules:
      - alert: ROMAHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(roma_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels: {severity: warning, category: api}
        annotations:
          summary: "p95 latency > 1s ({{ $value }}s)"

      - alert: ROMADeepQueue
        expr: roma_queue_depth > 10
        for: 3m
        labels: {severity: warning, category: resources}
        annotations:
          summary: "Queue depth {{ $value }} ≥ 10 — backends may be slow"

      - alert: ROMAAuthSpike
        expr: rate(roma_auth_failures_total[5m]) > 0.2
        for: 5m
        labels: {severity: warning, category: security}
        annotations:
          summary: "Auth failures spiking: {{ $value }} failures/sec — possible brute force"
