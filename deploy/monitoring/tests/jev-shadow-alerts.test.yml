rule_files:
  - ../alert-rules-roma.yml
evaluation_interval: 30s
tests:
  # (a) all traffic disabled. Producer semantics (monitoring/metrics.py:217-222,
  # one call per observation from cost/jev_shadow.py:_record_fallback): one fallback
  # is recorded with exactly one reason, so observations{outcome="fallback"} ==
  # fallback{reason="disabled"} and jev_error is necessarily 0. The disabled series
  # cancels out of the ratio -> FallbackHigh must NOT fire, early or late.
  - name: a_disabled_only_no_fire
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_observations_total{point="R1", outcome="fallback"}'
        values: '0+5x80'
      - series: 'roma_jev_shadow_fallback_total{point="R1", reason="disabled"}'
        values: '0+5x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: JevShadowFallbackHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: JevShadowFallbackHigh
        exp_alerts: []

  # (a2) 30% jev_error and the disabled series is ABSENT -> fires
  # (exercises the "or" fallback: obs - empty == empty in PromQL)
  - name: a2_no_disabled_series_fires
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_observations_total{point="R1", outcome="ok"}'
        values: '0+7x80'
      - series: 'roma_jev_shadow_observations_total{point="R1", outcome="fallback"}'
        values: '0+3x80'
      - series: 'roma_jev_shadow_fallback_total{point="R1", reason="jev_error"}'
        values: '0+3x80'
    alert_rule_test:
      - eval_time: 35m
        alertname: JevShadowFallbackHigh
        exp_alerts:
          - exp_labels:
              point: R1
              severity: warning
              category: jev-shadow
            exp_annotations:
              summary: "Jev R1 shadow: fallback выше 20% наблюдений (30%)"
              description: |
                Доля fallback-исходов среди shadow-наблюдений R1 выше 20% за 30m
                (reason="disabled" исключён из числителя и знаменателя). Shadow не
                меняет вердикт, но деградация Jev скрывает реальные расхождения
                классификатора.
                Runbook: docs/jev-shadow-ops-runbook.md
                Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.

  # (b) 30% jev_error among non-disabled, 50% disabled -> fires
  - name: b_30pct_fires
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_observations_total{point="R1", outcome="ok"}'
        values: '0+7x80'
      - series: 'roma_jev_shadow_observations_total{point="R1", outcome="fallback"}'
        values: '0+13x80'
      - series: 'roma_jev_shadow_fallback_total{point="R1", reason="jev_error"}'
        values: '0+3x80'
      - series: 'roma_jev_shadow_fallback_total{point="R1", reason="disabled"}'
        values: '0+10x80'
    alert_rule_test:
      # 30% is already above the threshold at 10m, but `for: 15m` is not satisfied
      # yet -> detects removal of the `for` clause.
      - eval_time: 10m
        alertname: JevShadowFallbackHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: JevShadowFallbackHigh
        exp_alerts:
          - exp_labels:
              point: R1
              severity: warning
              category: jev-shadow
            exp_annotations:
              summary: "Jev R1 shadow: fallback выше 20% наблюдений (30%)"
              description: |
                Доля fallback-исходов среди shadow-наблюдений R1 выше 20% за 30m
                (reason="disabled" исключён из числителя и знаменателя). Shadow не
                меняет вердикт, но деградация Jev скрывает реальные расхождения
                классификатора.
                Runbook: docs/jev-shadow-ops-runbook.md
                Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.

  # (c) 10% jev_error among non-disabled -> must NOT fire
  - name: c_10pct_no_fire
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_observations_total{point="R1", outcome="ok"}'
        values: '0+9x80'
      - series: 'roma_jev_shadow_observations_total{point="R1", outcome="fallback"}'
        values: '0+11x80'
      - series: 'roma_jev_shadow_fallback_total{point="R1", reason="jev_error"}'
        values: '0+1x80'
      - series: 'roma_jev_shadow_fallback_total{point="R1", reason="disabled"}'
        values: '0+10x80'
    alert_rule_test:
      - eval_time: 35m
        alertname: JevShadowFallbackHigh
        exp_alerts: []

  # (d) dropped series created with value 1 -> fires immediately;
  # the same series steady for >15m -> no false positive
  - name: d_first_dropped_fires
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_dropped_total{point="R1"}'
        values: '1+0x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: JevShadowDropped
        exp_alerts:
          - exp_labels:
              point: R1
              severity: warning
              category: jev-shadow
            exp_annotations:
              summary: "Jev R1 shadow: наблюдения отброшены (dropped)"
              description: |
                Очередь bounded-обсервера переполнена: хотя бы одно наблюдение отброшено
                за 15m либо серия впервые появилась с ненулевым значением.
                Данные shadow неполные, agreement-метрика занижена.
                Runbook: docs/jev-shadow-ops-runbook.md
                Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.
      - eval_time: 35m
        alertname: JevShadowDropped
        exp_alerts: []

  # (d2) dropped series steady at 0 for 20m and only then growing -> covers the
  # increase(...[15m]) > 0 branch, which the "new series" cases never reach.
  - name: d2_dropped_increase_after_15m
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_dropped_total{point="R1"}'
        values: '0+0x40 1+0x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: JevShadowDropped
        exp_alerts: []
      - eval_time: 16m
        alertname: JevShadowDropped
        exp_alerts: []
      - eval_time: 21m
        alertname: JevShadowDropped
        exp_alerts:
          - exp_labels:
              point: R1
              severity: warning
              category: jev-shadow
            exp_annotations:
              summary: "Jev R1 shadow: наблюдения отброшены (dropped)"
              description: |
                Очередь bounded-обсервера переполнена: хотя бы одно наблюдение отброшено
                за 15m либо серия впервые появилась с ненулевым значением.
                Данные shadow неполные, agreement-метрика занижена.
                Runbook: docs/jev-shadow-ops-runbook.md
                Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.
      - eval_time: 36m
        alertname: JevShadowDropped
        exp_alerts: []

  # (e) dropped constant 0 -> must NOT fire
  - name: e_zero_dropped_no_fire
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_dropped_total{point="R1"}'
        values: '0+0x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: JevShadowDropped
        exp_alerts: []

  # (r1) counter reset (restart) 5 -> 0 -> 1 -> fires on the drop after reset
  - name: r1_drop_after_restart_fires
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_dropped_total{point="R1"}'
        values: '5+0x40 0 1+0x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: JevShadowDropped
        exp_alerts: []
      - eval_time: 25m
        alertname: JevShadowDropped
        exp_alerts:
          - exp_labels:
              point: R1
              severity: warning
              category: jev-shadow
            exp_annotations:
              summary: "Jev R1 shadow: наблюдения отброшены (dropped)"
              description: |
                Очередь bounded-обсервера переполнена: хотя бы одно наблюдение отброшено
                за 15m либо серия впервые появилась с ненулевым значением.
                Данные shadow неполные, agreement-метрика занижена.
                Runbook: docs/jev-shadow-ops-runbook.md
                Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.

  # (p1) series with point="R2" -> selector {point="R1"} must NOT match
  - name: p1_other_point_ignored
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_dropped_total{point="R2"}'
        values: '1+0x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: JevShadowDropped
        exp_alerts: []

  # (m1) two instances dropping -> exactly ONE alert (sum by (point) dedupes)
  - name: m1_two_instances_single_alert
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_dropped_total{point="R1", instance="a"}'
        values: '1+0x80'
      - series: 'roma_jev_shadow_dropped_total{point="R1", instance="b"}'
        values: '1+0x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: JevShadowDropped
        exp_alerts:
          - exp_labels:
              point: R1
              severity: warning
              category: jev-shadow
            exp_annotations:
              summary: "Jev R1 shadow: наблюдения отброшены (dropped)"
              description: |
                Очередь bounded-обсервера переполнена: хотя бы одно наблюдение отброшено
                за 15m либо серия впервые появилась с ненулевым значением.
                Данные shadow неполные, agreement-метрика занижена.
                Runbook: docs/jev-shadow-ops-runbook.md
                Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.

  # (n1) new instance's first drop: instance="a" holds 0, instance="b" appears
  # later with value 1 -> the per-series `unless offset` (before sum) fires once.
  - name: n1_new_instance_first_drop
    interval: 30s
    input_series:
      - series: 'roma_jev_shadow_dropped_total{point="R1", instance="a"}'
        values: '0+0x80'
      - series: 'roma_jev_shadow_dropped_total{point="R1", instance="b"}'
        values: '_x40 1+0x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: JevShadowDropped
        exp_alerts: []
      - eval_time: 25m
        alertname: JevShadowDropped
        exp_alerts:
          - exp_labels:
              point: R1
              severity: warning
              category: jev-shadow
            exp_annotations:
              summary: "Jev R1 shadow: наблюдения отброшены (dropped)"
              description: |
                Очередь bounded-обсервера переполнена: хотя бы одно наблюдение отброшено
                за 15m либо серия впервые появилась с ненулевым значением.
                Данные shadow неполные, agreement-метрика занижена.
                Runbook: docs/jev-shadow-ops-runbook.md
                Откат: удалить JEV_GATE_SHADOW и JEV_ENABLED из реестра сервиса ключами.
      - eval_time: 40m
        alertname: JevShadowDropped
        exp_alerts: []
