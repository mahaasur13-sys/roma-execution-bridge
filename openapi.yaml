openapi: 3.1.0
info:
  title: ROMA Execution Bridge — DecisionOS v2.1.0
  version: 2.1.0
  description: |
    Multi-tenant GPU + LLM execution platform with full billing flow:
    GPU-second metering (A100, H100, L40S, RTX 3060), LLM token counting (tiktoken cl100k_base),
    spend-caps per plan (free/start/pro/enterprise), post-job completion billing updates,
    CloudPayments + Stripe integration, and 402 Payment Required enforcement.
  contact:
    name: asurdev
    url: https://asurdev.zo.computer
servers:
  - url: http://localhost:8900
    description: Zo sandbox
  - url: https://roma-execution-bridge-asurdev.zocomputer.io
    description: Production
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: {"status": "ok", "pg": false}
  /submit:
    post:
      summary: Submit GPU/LLM job (billing enforced)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task: {type: string, example: "train YOLOv8 on custom dataset"}
                gpu_required: {type: boolean, default: false}
                gpu_type: {type: string, example: "any"}
                input_tokens: {type: integer, default: 0, description: "LLM input tokens ($1/M)"}
                output_tokens: {type: integer, default: 0, description: "LLM output tokens ($2/M)"}
                plan: {type: string, enum: [free, start, pro, enterprise], default: free}
                priority: {type: integer, default: 5}
              example:
                task: "LLM inference GPT-4"
                gpu_required: true
                gpu_type: "A100"
                input_tokens: 8000
                output_tokens: 2000
                plan: "pro"
      responses:
        '202':
          description: Job queued with cost estimate
        '402':
          description: Spend cap exceeded — payment required
components:
  schemas:
    BillingUsage:
      type: object
      properties:
        tenant_id: {type: string, example: "tenant-pro-01"}
        total_gpu_seconds: {type: number, example: 3600.0}
        total_input_tokens: {type: integer, example: 1500000}
        total_output_tokens: {type: integer, example: 750000}
        total_cost_usd: {type: number, example: 3.036}
        spend_cap_usd: {type: number, example: 50.0}
        plan: {type: string, enum: [free, start, pro, enterprise]}
        balance_usd: {type: number, example: 3.036}
        remaining_cap_usd: {type: number, example: 46.964}
        alert_90pct: {type: boolean, example: false}
    BillingError:
      type: object
      properties:
        error: {type: string, example: "spend_cap_exceeded"}
        detail: {type: string}
        remaining_cap: {type: number}
        upgrade_url: {type: string}
